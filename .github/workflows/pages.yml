# Publish every Markdown file in the repository to GitHub Pages as HTML, with
# scripts/build_docs.py (docs/DEVELOPMENT.md, "Documentation site"). The build
# fails, and nothing is deployed, when a link, anchor, or image is broken.
# Pages' source is "GitHub Actions" (Settings > Pages), set once in T00b.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish rather than
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; pinned to a commit, as vakr's.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # md2html's inline metadata is its only dependency declaration.
          cache-dependency-glob: tools/md2html/md2html.py

      - name: Build the site and check every link and image
        run: python3 scripts/build_docs.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
