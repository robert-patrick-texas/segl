# The checks every change runs, on pushes to main and on pull requests. They
# are the commands in docs/DEVELOPMENT.md, "Checks", in three jobs side by
# side, and the browser tests in two parts of their own. This workflow
# publishes nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; pinned to a commit, as
      # Sunstone's and vakr's workflows do.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Node builds and tests web/. The version is web/.node-version (D2-023).
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked environment (Python from .python-version)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Install the locked web packages
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Web types
        run: npm --prefix web run check

      - name: Web unit tests
        run: npm --prefix web test

      - name: Web format
        run: npm --prefix web run format:check

      # Before pytest, which holds its stand-in for the build to the real one,
      # and before the browser tests, which Python serves it to.
      - name: Web build
        run: npm --prefix web run build

      # The mount tests and the browser tests run nginx with the deploy/nginx/
      # files. The mount tests skip on a host without nginx; SEGL_REQUIRE_NGINX
      # makes that a failure here. The tests of `segl update` sign and check
      # test releases with ssh-keygen, and merge nginx files with diff3.
      - name: Install nginx for the mount tests, and ssh-keygen and diff3 for the update tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx openssl openssh-client diffutils

      - name: Tests
        run: uv run pytest
        env:
          SEGL_REQUIRE_NGINX: "1"

  # The browser tests, in two parts side by side, each on a runner of its own.
  # Python serves the build, at a host root and behind nginx at /board/. Each
  # part runs three groups at once, each with servers of its own
  # (scripts/e2e.py). The parts must split the tests the same way, so the
  # number is set here and not measured; a runner has no other work.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked environment (Python from .python-version)
        run: uv sync --locked

      - name: Install the locked web packages
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Web build
        run: npm --prefix web run build

      - name: Install nginx for the tests behind it
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx openssl

      # The browser of the pinned @playwright/test, with its system libraries.
      - name: Install Chromium for the browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests, part ${{ matrix.part }} of 2
        run: python3 scripts/e2e.py --part ${{ matrix.part }}/2
        env:
          SEGL_TEST_GROUPS: "3"

      - name: Keep the browser traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.part }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Debian package: built in a clean ubuntu:26.04 container, then installed
  # in one that boots systemd, with nginx in front (docs/TEST-PLAN.md T-017).
  # It needs only Docker, git, and the runner's python3, which reads the version.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The builder image and the image the test boots take about a minute to
      # make. They are kept between runs, and made again each week, for the
      # base images' fixes, and when a Containerfile changes. The scripts
      # build an image only when its label does not hold its Containerfile's
      # hash (deploy/debian/build-deb.sh, package-test.sh).
      - name: The week, which the kept images' key holds
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: images
        with:
          path: ~/segl-images.tar
          key: segl-images-${{ steps.week.outputs.week }}-${{ hashFiles('deploy/debian/Containerfile', 'deploy/debian/Containerfile.systemd') }}

      - name: Load the kept images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load --input ~/segl-images.tar

      # Into dist/, for the artifact that publish compares with. The install
      # test, given no package, builds one in a folder of its own.
      - name: Build the package
        run: deploy/debian/build-deb.sh dist

      - name: Install it
        run: deploy/debian/package-test.sh dist/segl_*_amd64.deb

      - name: Keep the images for the next run
        if: steps.images.outputs.cache-hit != 'true'
        run: docker save segl-deb-builder segl-systemd-test --output ~/segl-images.tar

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: segl-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
