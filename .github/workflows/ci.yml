# The checks every change runs, on pushes to main and on pull requests. They
# are the commands in docs/DEVELOPMENT.md, "Checks". This workflow publishes
# nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; pinned to a commit, as
      # Sunstone's and vakr's workflows do.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Node builds and tests web/. The version is web/.node-version (D2-023).
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the locked environment (Python from .python-version)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Install the locked web packages
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Web types
        run: npm --prefix web run check

      - name: Web unit tests
        run: npm --prefix web test

      - name: Web format
        run: npm --prefix web run format:check

      # Before pytest, which holds its stand-in for the build to the real one,
      # and before the browser tests, which Python serves it to.
      - name: Web build
        run: npm --prefix web run build

      # The mount tests and the browser tests run nginx with the deploy/nginx/
      # files. The mount tests skip on a host without nginx; SEGL_REQUIRE_NGINX
      # makes that a failure here. The tests of `segl update` sign and check
      # test releases with ssh-keygen, and merge nginx files with diff3.
      - name: Install nginx for the mount tests, and ssh-keygen and diff3 for the update tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx openssl openssh-client diffutils

      - name: Tests
        run: uv run pytest
        env:
          SEGL_REQUIRE_NGINX: "1"

      # The browser of the pinned @playwright/test, with its system libraries.
      - name: Install Chromium for the browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Python serves the build, at a host root and behind nginx at /board/.
      # scripts/e2e.py runs the tests in as many groups at once as the runner
      # has room for, each with servers of its own.
      - name: Browser tests
        run: python3 scripts/e2e.py

      - name: Keep the browser traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Debian package: built in a clean ubuntu:26.04 container, then installed
  # in one that boots systemd, with nginx in front (docs/TEST-PLAN.md T-017).
  # It needs only Docker, git, and the runner's python3, which reads the version.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the package and install it
        run: deploy/debian/package-test.sh

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: segl-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
