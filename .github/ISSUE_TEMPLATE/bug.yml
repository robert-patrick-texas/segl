name: Bug
description: A defect in segl
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Slot, browser, and segl version
      description: segl --version, or the application version in versions.toml
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
    validations:
      required: false
