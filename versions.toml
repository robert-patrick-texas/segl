# Canonical versions for segl.
# Application code reads this file to display or check a version.
# The release script reads it, updates it, and copies the result into
# the release notes. Transitive dependencies stay in the lockfiles.

[project]
name = "segl"
version = "0.1.0"
license = "Apache-2.0"

[runtime]
# Exact CPython. `scripts/release.py check` reports a newer one from
# `uv python list`; `upgrade` moves to it after the tests pass (D2-016).
python = "3.15.2"
# Node builds the frontend and runs its tests; it is not a runtime service.
# The newest LTS release. web/.node-version mirrors it (D2-023).
node = "26.13.1"

[python.dependencies]
fastapi = "0.162.7"
uvicorn = "0.54.0"
websockets = "17.4"

[python.dev]
httpx2 = "2.16.0"
pytest = "9.2.0"
pytest-xdist = "3.8.0"
ruff = "0.17.5"
ty = "0.0.104"

# The build backend, [build-system] requires in pyproject.toml.
[python.build]
hatchling = "1.33.0"

# Also the `docs` dependency group in pyproject.toml.
# The documentation site's converter, tools/md2html (copied from vakr).
# Its inline script metadata (PEP 723) mirrors these pins.
[python.docs]
markdown-it-py = "4.3.0"
mdit-py-plugins = "0.7.0"

# web/package.json mirrors these two tables: dependencies and devDependencies.
[web.dependencies]
"@excalidraw/excalidraw" = "0.18.1"
react = "19.3.1"
react-dom = "19.3.1"
react-router = "8.5.1"

[web.dev]
"@playwright/test" = "1.65.1"
"@types/node" = "26.6.6"
"@types/react" = "19.3.0"
"@types/react-dom" = "19.3.0"
"@vitejs/plugin-react" = "6.3.0"
prettier = "3.10.1"
typescript = "7.0.2"
vite = "8.3.8"
vitest = "5.1.0"

# Filled by scripts/release.py when a newer release fails tests.
# Example:
# [held.fastapi]
# version = "0.115.6"
# skipped = "0.116.0"
# reason = "tests failed"
# since = "2026-11-11"
[held]

[publish]
github = true
github_repo = "robert-patrick-texas/segl"
pypi = false
