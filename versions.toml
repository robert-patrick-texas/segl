# Canonical versions for segl.
# Application code reads this file to display or check a version.
# The release script reads it, updates it, and copies the result into
# the release notes. Transitive dependencies stay in the lockfiles.

[project]
name = "segl"
version = "0.0.0"
license = "Apache-2.0"

[runtime]
# Exact CPython. `scripts/release.py check` reports a newer one from
# `uv python list`; `upgrade` moves to it after the tests pass (D2-016).
python = "3.15.2"
# Node builds the frontend. T04 sets the newest LTS release; empty until then.
node = ""

[python.dependencies]

[python.dev]

# The documentation site's converter, tools/md2html (copied from vakr).
# Its inline script metadata (PEP 723) mirrors these pins.
[python.docs]
markdown-it-py = "4.3.0"
mdit-py-plugins = "0.7.0"

[web.dependencies]

[web.dev]

# Filled by scripts/release.py when a newer release fails tests.
# Example:
# [held.fastapi]
# version = "0.115.6"
# skipped = "0.116.0"
# reason = "tests failed"
# since = "2026-11-11"
[held]

[publish]
github = true
github_repo = "robert-patrick-texas/segl"
pypi = false
