# Which tests run each row of docs/TEST-PLAN.md.
#
# `scripts/testplan.py` runs pytest and the browser tests once, then reads
# each row's result here. A row passes when every test it names ran and
# passed. A skipped test fails its row. `tests/test_testplan.py` holds this
# file to the test plan and to the tests' names.
#
# pytest:  "tests/file.py" is every test of the file.
#          "tests/file.py::test_name" is one test, with all its cases.
# browser: "file.spec.ts" is every test of the spec.
#          "file.spec.ts > title" is one test. A test inside a
#          `test.describe` has the group's title first: "spec > group > title".
#
# T-017 (the .deb, which deploy/debian/package-test.sh installs) and T-018
# (this run, in the dev container) have no tests here. The script says so.

# The Playwright projects a spec's tests must pass in. `default` is the three
# mounts: Python alone, nginx at a host root, and nginx at /board/.
[projects]
default = ["direct", "root", "board"]
"access.spec.ts" = ["access-direct", "access-root", "access-board"]
"durability.spec.ts" = ["restart"]
"expiry.spec.ts" = ["restart"]

[rows.T-001]
pytest = [
    "tests/test_room.py::test_a_drawn_element_reaches_the_others_and_not_its_sender",
    "tests/test_collab.py::test_two_connections_on_a_slot_see_each_other_and_share_edits",
]
browser = ["collab.spec.ts > a rectangle drawn in one browser appears in the other"]

[rows.T-002]
pytest = ["tests/test_room.py::test_two_people_drawing_at_once_both_keep_their_elements"]
browser = ["collab.spec.ts > both browsers draw at the same time, and both elements remain"]

