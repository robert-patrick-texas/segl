# The three folders under /opt/segl that the package does not own. postinst
# makes them with `systemd-tmpfiles --create segl.conf`. dpkg never removes
# or overwrites what is in them: the site's settings, the boards, and what
# `segl update` keeps.
#
# etc/ is root's: segl reads its settings and cannot change them.
# var/ is segl's: the database and the uploaded images.
# update/ is root's alone: downloaded packages, and copies of the settings
# and the database from before each update. The settings hold the access
# codes, so nobody else reads there, and nobody else can plant a package.
#Type Path              Mode User Group Age
d     /opt/segl/etc     0755 root root  -
d     /opt/segl/var     0750 segl segl  -
d     /opt/segl/update  0700 root root  -
