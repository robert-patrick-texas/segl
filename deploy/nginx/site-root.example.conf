# Example site: segl on a host name of its own, https://board.example.com/s/1
#
# Install as /etc/nginx/sites-available/board.example.com, link it from
# sites-enabled, install conf.d/segl.conf and snippets/segl-proxy.conf
# (docs/DEPLOY.md), then: sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP only sends the browser on to HTTPS. Whether to answer on port 80
# at all is the site's policy: remove this block and nothing does.
server {
    listen 80;
    listen [::]:80;
    server_name board.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name board.example.com;

    # The site's own certificate. snakeoil is Ubuntu's self-signed placeholder.
    include snippets/snakeoil.conf;

    # TLS 1.2 and 1.3 only. For 1.2, only ciphers with forward secrecy and
    # authenticated encryption. No session tickets, whose key nginx would keep
    # until it restarts. A site with a TLS policy of its own puts it here.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:segl_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Not which nginx this is.
    server_tokens off;

    # Server-level headers. segl-proxy.conf adds none, so these still apply.
    # A browser that has been here once asks for HTTPS only, for a year: a
    # page served over plain http in this site's name is then never loaded.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # A file is the type the server says it is. segl says so itself for an
    # uploaded file, and once is enough.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    # No other site is told which page a link was followed from.
    add_header Referrer-Policy "same-origin" always;
    # No other site shows these pages inside a frame of its own.
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        include snippets/segl-proxy.conf;
    }
}
