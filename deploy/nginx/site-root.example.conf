# Example site: segl on a host name of its own, https://board.example.com/s/1
#
# Install as /etc/nginx/sites-available/board.example.com, link it from
# sites-enabled, install conf.d/segl.conf and snippets/segl-proxy.conf
# (docs/DEPLOY.md), then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name board.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name board.example.com;

    # The site's own certificate. snakeoil is Ubuntu's self-signed placeholder.
    include snippets/snakeoil.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        include snippets/segl-proxy.conf;
    }
}
