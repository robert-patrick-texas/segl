# segl: http-level definitions for snippets/segl-proxy.conf.
#
# Install as /etc/nginx/conf.d/segl.conf. Ubuntu's nginx.conf loads
# conf.d/*.conf inside its http { } block. On its own this file changes nothing.

# The segl service. Keep in step with `bind` in /opt/segl/etc/segl.toml.
upstream segl {
    server 127.0.0.1:8000;
    keepalive 16;
}

# "Connection: upgrade" for the WebSocket at /collab only. Every other request
# sends an empty value, so nginx keeps its connections to segl alive.
map $http_upgrade $segl_connection {
    default upgrade;
    ""      "";
}
