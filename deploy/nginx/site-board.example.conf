# Example site: segl at https://dev.example.com/board/ beside the site's own
# content. A site that already exists needs only the include line.
#
# Install as /etc/nginx/sites-available/dev.example.com, link it from
# sites-enabled, install the three segl files (docs/DEPLOY.md), then:
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dev.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.example.com;

    # The site's own certificate. snakeoil is Ubuntu's self-signed placeholder.
    include snippets/snakeoil.conf;

    # Server-level headers. segl-proxy.conf adds none, so these still apply.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/html;

    include snippets/segl-board.conf;
}
