# segl at /board/ on an existing site, e.g. https://dev.example.com/board/s/1
#
# Install as /etc/nginx/snippets/segl-board.conf, beside
# snippets/segl-proxy.conf and conf.d/segl.conf, then add one line inside the
# site's server { } block:
#
#     include snippets/segl-board.conf;
#
# then: sudo nginx -t && sudo systemctl reload nginx
#
# For another path, change /board in the three places below. segl has no
# setting for the path; it works under whatever prefix nginx strips.

# Relative redirects stay right behind TLS-terminating load balancers and odd ports.
location = /board {
    absolute_redirect off;
    return 301 /board/;
}

# ^~ keeps the site's regular-expression locations (static-file and cache
# rules and the like) from claiming segl's assets, API, or WebSocket.
location ^~ /board/ {
    include snippets/segl-proxy.conf;

    # Slots are open to anyone who can reach this URL. To narrow that, add
    # network rules or a password here. Neither one uses cookies:
    #   allow 10.0.0.0/8;
    #   deny  all;
    #   auth_basic           "segl";
    #   auth_basic_user_file /etc/nginx/segl.htpasswd;
}
