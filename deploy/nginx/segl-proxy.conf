# segl: proxy settings for the one location that serves segl.
#
# Install as /etc/nginx/snippets/segl-proxy.conf and include it inside a
# location block: snippets/segl-board.conf does that for /board/, and a site
# that gives segl its own host name includes it in `location / { }`.
# Needs the upstream and map in conf.d/segl.conf.

# The trailing slash replaces the location's prefix with "/", so
# https://dev.example.com/board/s/1 reaches segl as /s/1. segl asks for
# everything relative to its page, so the browser stays under /board/.
# Under `location /` it changes nothing.
proxy_pass         http://segl/;
proxy_http_version 1.1;
# segl's own redirects are relative; leave them alone.
proxy_redirect     off;

# $http_host keeps the port, so segl's Origin check still matches the
# browser's Origin when the site listens on a port other than 443.
proxy_set_header   Host              $http_host;
# segl believes these only from `trusted_proxies` (default 127.0.0.1 and ::1).
# $remote_addr replaces any X-Forwarded-For the client sent, so a client
# cannot choose the address the display-name rate limit counts.
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
# The WebSocket upgrade for /collab.
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $segl_connection;

# The largest request is a scene import, up to `max_scene_bytes` (50 MiB by
# default); uploaded images stop at `max_asset_bytes` (10 MiB). Keep this a
# little above both, so segl answers an oversized body with its own JSON
# `payload_too_large` error instead of nginx's HTML page.
client_max_body_size 52m;

proxy_connect_timeout 5s;
# segl pings every WebSocket every 20 s, so an open board is never idle this
# long. A longer value only keeps a hung request waiting.
proxy_read_timeout    120s;
proxy_send_timeout    120s;

# The editor bundle is several megabytes of JavaScript. Ubuntu's nginx.conf
# sets `gzip off`, so turn it on here for segl's text types (HTML is always
# included). Responses carry no secrets: no access code is ever sent back.
gzip            on;
gzip_vary       on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types      text/css text/javascript application/javascript application/json image/svg+xml;

# No add_header here on purpose: one add_header in a location discards every
# add_header the server block sets, HSTS included. Set HSTS on the server.
